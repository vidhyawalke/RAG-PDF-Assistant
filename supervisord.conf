[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:fastapi]
command=/usr/local/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/fastapi.err.log
stdout_logfile=/var/log/supervisor/fastapi.out.log
stopasgroup=true

[program:streamlit]
command=/bin/sh -c "exec /usr/local/bin/streamlit run frontend/app.py --server.port=${PORT:-8501} --server.address=0.0.0.0 --logger.level=info"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/streamlit.err.log
stdout_logfile=/var/log/supervisor/streamlit.out.log
stopasgroup=true
environment=PYTHONUNBUFFERED=1

[group:rag_services]
programs=fastapi,streamlit
priority=999
