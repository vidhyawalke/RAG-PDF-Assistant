version: '3.8'

services:
  rag-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    container_name: rag_pdf_assistant
    ports:
      - "8000:8000"
      - "8001:8001"
    env_file:
      - .env
    environment:
      # Use loopback address inside container for internal FastAPI communication
      API_URL: "http://127.0.0.1:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./vector_store:/app/vector_store
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
